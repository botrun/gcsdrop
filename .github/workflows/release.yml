name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the release already exists (e.g., tag was deleted and re-pushed),
          # verify it is viewable rather than failing the step.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "gcsdrop $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: gcsdrop-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: gcsdrop-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: cross
      - name: Test (host arch only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross test --target ${{ matrix.target }}
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ${{ matrix.asset }}.tar.gz \
            -C target/${{ matrix.target }}/release gcsdrop
          sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256
          # No --clobber: a published asset must stay byte-stable so that
          # `sha256sum -c` in someone's Dockerfile keeps working.
          gh release upload "$GITHUB_REF_NAME" \
            ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY"

  macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Test and build
        run: |
          cargo test
          cargo build --release
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf gcsdrop-macos-arm64.tar.gz -C target/release gcsdrop
          shasum -a 256 gcsdrop-macos-arm64.tar.gz > gcsdrop-macos-arm64.tar.gz.sha256
          gh release upload "$GITHUB_REF_NAME" \
            gcsdrop-macos-arm64.tar.gz gcsdrop-macos-arm64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY"
